name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci-checks.yml
  build-tdlib:
    needs: checks
    uses: ./.github/workflows/build-tdlib.yml
  native:
    needs: build-tdlib
    uses: ./.github/workflows/ci-native.yml
