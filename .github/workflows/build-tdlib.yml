name: Build TDLib

on:
    workflow_dispatch:
    workflow_call:

# TDLib sources are vendored in td/ (git subtree of tdlib/td), so every job
# builds the tree of the checked-out commit. Cache keys carry the td/ tree hash:
# a change anywhere in td/ rebuilds, and an unchanged tree reuses the cache.
permissions:
    contents: read

jobs:
    config:
        runs-on: ubuntu-latest
        outputs:
            linux: ${{ steps.metadata.outputs.linux }}
            macos: ${{ steps.metadata.outputs.macos }}
            windows: ${{ steps.metadata.outputs.windows }}
            android: ${{ steps.metadata.outputs.android }}
        steps:
            - uses: actions/checkout@v6
            - id: metadata
              run: python .github/scripts/ci_metadata.py
    build-linux:
        needs: config
        strategy:
            fail-fast: false
            matrix:
                os: ${{ fromJSON(needs.config.outputs.linux) }}
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Resolve build metadata
              shell: bash
              run: python .github/scripts/ci_metadata.py
            - name: Restore cache TDLib
              id: cache-tdlib-restore
              uses: actions/cache/restore@v4
              with:
                  path: td/tdlib
                  key: ${{ env.TDLIB_ARTIFACT }}-${{ matrix.os }}-${{ env.RUNNER_IMAGE }}-${{ env.TD_TREE }}-${{ env.BUILD_RECIPE }}
            - name: Setup ccache
              if: steps.cache-tdlib-restore.outputs.cache-hit != 'true'
              uses: hendrikmuhs/ccache-action@v1.2
              with:
                create-symlink: true
                key: ccache-${{ env.TDLIB_ARTIFACT }}-${{ env.BUILD_RECIPE }}
            - name: Build TDLib
              if: steps.cache-tdlib-restore.outputs.cache-hit != 'true'
              env:
                  CCACHE_DIR: ${{ github.workspace }}/.ccache
                  CCACHE_MAXSIZE: ${{ env.CCACHE_MAXSIZE }}
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends make git zlib1g-dev libssl-dev gperf php-cli cmake clang-${LINUX_CLANG_VERSION} libc++-${LINUX_CLANG_VERSION}-dev libc++abi-${LINUX_CLANG_VERSION}-dev
                  cd td
                  rm -rf build
                  mkdir build
                  cd build
                  CXXFLAGS="-stdlib=libc++" \
                  CC=/usr/bin/clang-${LINUX_CLANG_VERSION} \
                  CXX=/usr/bin/clang++-${LINUX_CLANG_VERSION} \
                  cmake -G Ninja -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_INSTALL_PREFIX:PATH=../tdlib \
                    -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                    -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                    ..
                  cmake --build . --target install --parallel
            - name: Copy OpenSSL and zlib static libraries
              if: steps.cache-tdlib-restore.outputs.cache-hit != 'true'
              run: |
                  cp /usr/lib/*/libssl.a ./td/tdlib/lib/ || cp /usr/lib/libssl.a ./td/tdlib/lib/
                  cp /usr/lib/*/libcrypto.a ./td/tdlib/lib/ || cp /usr/lib/libcrypto.a ./td/tdlib/lib/
                  cp /usr/lib/*/libz.a ./td/tdlib/lib/ || cp /usr/lib/libz.a ./td/tdlib/lib/
            - name: Make pkg-config metadata relocatable
              if: steps.cache-tdlib-restore.outputs.cache-hit != 'true'
              shell: bash
              run: python .github/scripts/relocate_pkgconfig.py td/tdlib
            - name: Save cache TDLib
              uses: actions/cache/save@v4
              if: steps.cache-tdlib-restore.outputs.cache-hit != 'true'
              with:
                  path: td/tdlib
                  key: ${{ steps.cache-tdlib-restore.outputs.cache-primary-key }}
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ env.TDLIB_ARTIFACT }}
                  path: ./td/tdlib/
                  if-no-files-found: error
                  overwrite: true

    build-macos:
        needs: config
        strategy:
            fail-fast: false
            matrix:
                os: ${{ fromJSON(needs.config.outputs.macos) }}
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Resolve build metadata
              shell: bash
              run: python .github/scripts/ci_metadata.py
            - name: Restore cache TDLib
              id: cache-tdlib-restore
              uses: actions/cache/restore@v4
              with:
                  path: td/tdlib
                  key: ${{ env.TDLIB_ARTIFACT }}-${{ matrix.os }}-${{ env.RUNNER_IMAGE }}-${{ env.TD_TREE }}-${{ env.BUILD_RECIPE }}
            - name: Setup ccache
              if: steps.cache-tdlib-restore.outputs.cache-hit != 'true'
              uses: hendrikmuhs/ccache-action@v1.2
              with:
                create-symlink: true
                key: ccache-${{ env.TDLIB_ARTIFACT }}-${{ env.BUILD_RECIPE }}
            - name: Build TDLib
              if: steps.cache-tdlib-restore.outputs.cache-hit != 'true'
              env:
                  CCACHE_DIR: ${{ github.workspace }}/.ccache
                  CCACHE_MAXSIZE: ${{ env.CCACHE_MAXSIZE }}
              run: |
                  brew install gperf openssl zlib
                  cd td
                  rm -rf build
                  mkdir build
                  cd build
                  OPENSSL_DIR=$(brew --prefix openssl)
                  ZLIB_DIR=$(brew --prefix zlib)
                  cmake -G Ninja \
                    -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_BUILD_TYPE=Release \
                    -DOPENSSL_ROOT_DIR=$OPENSSL_DIR \
                    -DCMAKE_INSTALL_PREFIX:PATH=../tdlib \
                    -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                    -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                    ..
                  cmake --build . --target install --parallel
            - name: Copy OpenSSL and zlib static libraries
              if: steps.cache-tdlib-restore.outputs.cache-hit != 'true'
              run: |
                  OPENSSL_DIR=$(brew --prefix openssl)
                  ZLIB_DIR=$(brew --prefix zlib)
                  # Copy OpenSSL and zlib static libraries
                  cp $OPENSSL_DIR/lib/libssl.a ./td/tdlib/lib/
                  cp $OPENSSL_DIR/lib/libcrypto.a ./td/tdlib/lib/
                  cp $ZLIB_DIR/lib/libz.a ./td/tdlib/lib/
            - name: Make pkg-config metadata relocatable
              if: steps.cache-tdlib-restore.outputs.cache-hit != 'true'
              shell: bash
              run: python .github/scripts/relocate_pkgconfig.py td/tdlib
            - name: Save cache TDLib
              uses: actions/cache/save@v4
              if: steps.cache-tdlib-restore.outputs.cache-hit != 'true'
              with:
                  path: td/tdlib
                  key: ${{ steps.cache-tdlib-restore.outputs.cache-primary-key }}
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ env.TDLIB_ARTIFACT }}
                  path: ./td/tdlib/
                  if-no-files-found: error
                  overwrite: true

    build-windows:
        needs: config
        strategy:
            fail-fast: false
            matrix:
                os: ${{ fromJSON(needs.config.outputs.windows) }}
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Resolve build metadata
              shell: bash
              run: python .github/scripts/ci_metadata.py
            - name: Restore cache TDLib
              id: cache-tdlib-restore
              uses: actions/cache/restore@v4
              with:
                  path: td/tdlib
                  key: ${{ env.TDLIB_ARTIFACT }}-${{ matrix.os }}-${{ env.RUNNER_IMAGE }}-${{ env.TD_TREE }}-${{ env.BUILD_RECIPE }}
            - name: Setup ccache
              if: steps.cache-tdlib-restore.outputs.cache-hit != 'true'
              uses: hendrikmuhs/ccache-action@v1.2
              with:
                key: ccache-${{ env.TDLIB_ARTIFACT }}-${{ env.BUILD_RECIPE }}
            - name: Set up MSVC Developer Command Prompt
              uses: ilammy/msvc-dev-cmd@v1
              with:
                arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
            - name: Build TDLib
              if: steps.cache-tdlib-restore.outputs.cache-hit != 'true'
              env:
                  CCACHE_DIR: ${{ github.workspace }}/.ccache
                  CCACHE_MAXSIZE: ${{ env.CCACHE_MAXSIZE }}
                  CCACHE_CPP2: "yes"
                  CCACHE_SLOPPINESS: time_macros
                  MSYS_NO_PATHCONV: "1"
              run: |
                  VCPKG_ROOT="${VCPKG_INSTALLATION_ROOT:?runner must provide VCPKG_INSTALLATION_ROOT}"
                  cd td
                  if [[ "$RUNNER_ARCH" == "X64" ]]; then
                    CMAKE_ARCH="x64"
                  elif [[ "$RUNNER_ARCH" == "ARM64" ]]; then
                    CMAKE_ARCH="arm64"
                  else
                    echo "Unsupported architecture: $RUNNER_ARCH"
                    exit 1
                  fi
                  VCPKG_TRIPLET_STATIC="${CMAKE_ARCH}-windows-static-release"
                  VCPKG_TRIPLET_DYNAMIC="${CMAKE_ARCH}-windows-release"
                  cat << EOF > "${VCPKG_ROOT}/triplets/community/${CMAKE_ARCH}-windows-release.cmake"
                  set(VCPKG_TARGET_ARCHITECTURE ${CMAKE_ARCH})
                  set(VCPKG_CRT_LINKAGE dynamic)
                  set(VCPKG_LIBRARY_LINKAGE dynamic)
                  set(VCPKG_BUILD_TYPE release)
                  EOF
                  vcpkg install gperf:$VCPKG_TRIPLET_DYNAMIC gperf:$VCPKG_TRIPLET_STATIC
                  vcpkg install openssl:$VCPKG_TRIPLET_DYNAMIC zlib:$VCPKG_TRIPLET_DYNAMIC
                  vcpkg install openssl:$VCPKG_TRIPLET_STATIC zlib:$VCPKG_TRIPLET_STATIC

                  # Build
                  mkdir build-dynamic
                  cd build-dynamic
                  cmake -G Ninja \
                      -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_BUILD_TYPE=Release \
                      -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                      -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                      -DCMAKE_C_FLAGS="/GR- /W4" \
                      -DCMAKE_CXX_FLAGS="/GR- /W4" \
                      -DCMAKE_INSTALL_PREFIX:PATH=../tdlib \
                      -DCMAKE_TOOLCHAIN_FILE:FILEPATH="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                      -DVCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET_DYNAMIC" \
                      ..
                  cmake --build . --target install --parallel --config Release
                  cd ..
                  rm -rf build-dynamic
                  mv tdlib/lib/tdjson.lib ./tdjson_dynamic.lib
                  rm -rf tdlib/include tdlib/lib
                  mkdir build-static
                  cd build-static
                  cmake -G Ninja \
                      -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_BUILD_TYPE=Release \
                      -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                      -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                      -DCMAKE_C_FLAGS="/GR- /W4" \
                      -DCMAKE_CXX_FLAGS="/GR- /W4" \
                      -DCMAKE_INSTALL_PREFIX:PATH=../tdlib \
                      -DCMAKE_TOOLCHAIN_FILE:FILEPATH="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                      -DVCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET_STATIC" \
                      ..
                  cmake --build . --target install --parallel --config Release
                  cd ..
                  mv ./tdjson_dynamic.lib tdlib/lib/tdjson.lib
                  # Copy dependencies to lib
                  # lib/ also contains pkgconfig/; copy library files only.
                  cp "${VCPKG_ROOT}/installed/$VCPKG_TRIPLET_STATIC/lib/"*.lib tdlib/lib/
                  cp "${VCPKG_ROOT}/installed/$VCPKG_TRIPLET_DYNAMIC/bin/"*.dll tdlib/bin/
              shell: bash
            - name: Make pkg-config metadata relocatable
              if: steps.cache-tdlib-restore.outputs.cache-hit != 'true'
              shell: bash
              run: python .github/scripts/relocate_pkgconfig.py td/tdlib
            - name: Save cache TDLib
              uses: actions/cache/save@v4
              if: steps.cache-tdlib-restore.outputs.cache-hit != 'true'
              with:
                  path: ./td/tdlib
                  key: ${{ steps.cache-tdlib-restore.outputs.cache-primary-key }}
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ env.TDLIB_ARTIFACT }}
                  path: ./td/tdlib/
                  if-no-files-found: error
                  overwrite: true

    build-android:
        needs: config
        strategy:
            fail-fast: false
            matrix:
                abi: ${{ fromJSON(needs.config.outputs.android) }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Resolve build metadata
              shell: bash
              run: python .github/scripts/ci_metadata.py --os android --arch ${{ matrix.abi }}
            - name: Restore cache TDLib
              id: cache-tdlib-restore
              uses: actions/cache/restore@v4
              with:
                  path: td/tdlib
                  key: ${{ env.TDLIB_ARTIFACT }}-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-${{ env.TD_TREE }}-${{ env.BUILD_RECIPE }}
            - name: Setup ccache
              if: steps.cache-tdlib-restore.outputs.cache-hit != 'true'
              uses: hendrikmuhs/ccache-action@v1.2
              with:
                create-symlink: true
                key: ccache-${{ env.TDLIB_ARTIFACT }}-${{ env.BUILD_RECIPE }}
            - name: Setup Android NDK
              if: steps.cache-tdlib-restore.outputs.cache-hit != 'true'
              run: |
                  echo "y" | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$ANDROID_NDK_VERSION"
                  NDK_ROOT="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
                  echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
                  echo "NDK_TOOLCHAIN=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64" >> "$GITHUB_ENV"
                  case "${{ matrix.abi }}" in
                    aarch64)
                      echo "OPENSSL_TARGET=android-arm64" >> $GITHUB_ENV
                      echo "ANDROID_ABI=arm64-v8a" >> $GITHUB_ENV
                      ;;
                    x86_64)
                      echo "OPENSSL_TARGET=android-x86_64" >> $GITHUB_ENV
                      echo "ANDROID_ABI=x86_64" >> $GITHUB_ENV
                      ;;
                  esac
            - name: Build static openssl for Android
              if: steps.cache-tdlib-restore.outputs.cache-hit != 'true'
              run: |
                  wget -q https://www.openssl.org/source/openssl-${{ env.OPENSSL_VERSION }}.tar.gz
                  tar -xzf openssl-${{ env.OPENSSL_VERSION }}.tar.gz
                  cd openssl-${{ env.OPENSSL_VERSION }}
                  export PATH=$NDK_TOOLCHAIN/bin:$PATH
                  ./Configure $OPENSSL_TARGET no-shared no-tests \
                    --prefix=$(pwd)/openssl-install
                  make -j$(nproc)
                  make install_sw
                  echo "OPENSSL_ROOT_DIR=$(pwd)/openssl-install" >> $GITHUB_ENV
            - name: Build TDLib
              if: steps.cache-tdlib-restore.outputs.cache-hit != 'true'
              env:
                  CCACHE_DIR: ${{ github.workspace }}/.ccache
                  CCACHE_MAXSIZE: ${{ env.CCACHE_MAXSIZE }}
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends make git zlib1g-dev libssl-dev gperf php-cli
                  cd td
                  # Generate auto-generated files using native host build before cross-compiling
                  mkdir native_build
                  cd native_build
                  env -u OPENSSL_ROOT_DIR cmake -G Ninja -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_BUILD_TYPE=Release ..
                  cmake --build . --target prepare_cross_compiling --parallel
                  cd ..
                  rm -rf build
                  mkdir build
                  cd build
                  cmake -G Ninja -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
                    -DANDROID_ABI=$ANDROID_ABI \
                    -DANDROID_PLATFORM=android-$ANDROID_API \
                    -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                    -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                    -DCMAKE_INSTALL_PREFIX:PATH=../tdlib \
                    -DOPENSSL_ROOT_DIR=$OPENSSL_ROOT_DIR \
                    -DOPENSSL_INCLUDE_DIR=$OPENSSL_ROOT_DIR/include \
                    -DOPENSSL_CRYPTO_LIBRARY=$OPENSSL_ROOT_DIR/lib/libcrypto.a \
                    -DOPENSSL_SSL_LIBRARY=$OPENSSL_ROOT_DIR/lib/libssl.a \
                    -DTD_ENABLE_JNI=ON \
                    ..
                  cmake --build . --target install/strip --parallel
            - name: Copy OpenSSL and zlib static libraries
              if: steps.cache-tdlib-restore.outputs.cache-hit != 'true'
              run: |
                  mkdir -p ./td/tdlib/lib
                  cp $OPENSSL_ROOT_DIR/lib/libssl.a ./td/tdlib/lib/
                  cp $OPENSSL_ROOT_DIR/lib/libcrypto.a ./td/tdlib/lib/
                  cp $NDK_TOOLCHAIN/sysroot/usr/lib/${{ matrix.abi }}-linux-android/libz.a ./td/tdlib/lib/
            - name: Strip Android artifacts
              if: steps.cache-tdlib-restore.outputs.cache-hit != 'true'
              run: |
                  STRIP_TOOL="$NDK_TOOLCHAIN/bin/llvm-strip"
                  if [ ! -x "$STRIP_TOOL" ]; then
                    echo "strip tool not found: $STRIP_TOOL"
                    exit 1
                  fi

                  # Reduce size of shared objects while preserving runtime-required symbols.
                  find ./td/tdlib -type f \( -name "*.so" -o -name "*.so.*" \) -print0 | while IFS= read -r -d '' file; do
                    "$STRIP_TOOL" --strip-unneeded "$file"
                  done

                  # Strip built archives, preserving the NDK-provided libz.a unchanged:
                  # it can contain LLVM bitcode that llvm-strip cannot process.
                  find ./td/tdlib -type f -name "*.a" ! -name "libz.a" -print0 | while IFS= read -r -d '' file; do
                    "$STRIP_TOOL" -g "$file"
                  done
            - name: Make pkg-config metadata relocatable
              if: steps.cache-tdlib-restore.outputs.cache-hit != 'true'
              shell: bash
              run: python .github/scripts/relocate_pkgconfig.py td/tdlib
            - name: Save cache TDLib
              uses: actions/cache/save@v4
              if: steps.cache-tdlib-restore.outputs.cache-hit != 'true'
              with:
                  path: td/tdlib
                  key: ${{ steps.cache-tdlib-restore.outputs.cache-primary-key }}
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ env.TDLIB_ARTIFACT }}
                  path: ./td/tdlib/
                  if-no-files-found: error
                  overwrite: true
