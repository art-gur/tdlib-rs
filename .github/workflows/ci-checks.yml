name: Rust checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.metadata.outputs.desktop }}
    steps:
      - uses: actions/checkout@v6
      - id: metadata
        run: python .github/scripts/ci_metadata.py
      - name: Validate release tag before native builds
        if: github.ref_type == 'tag'
        run: |
          test "$GITHUB_REF_NAME" = "$RELEASE_TAG"
          test "$GITHUB_REPOSITORY" = "$RELEASE_REPOSITORY"
      - name: Validate GitHub Actions workflows
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - run: python -m pip install -r .github/requirements.txt
      - run: python -m unittest discover -s .github/scripts -p 'test_*.py'
  rust:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.config.outputs.desktop) }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --exclude tdlib-rs
      - run: cargo check --all-targets --features docs
      - run: cargo clippy --all-targets --features docs -- -D warnings
